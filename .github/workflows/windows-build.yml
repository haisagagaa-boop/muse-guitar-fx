# Windows build (CI)
#
# Menjalankan build host di Windows: shared core + smoke tests + JUCE smoke test.
# Berjalan di GitHub Actions (windows-2022, Visual Studio 2022).
#
# PINNING RUNNER — windows-2022, BUKAN windows-latest:
# Run pertama (45009798107, 2026-11-22) GAGAL di langkah Configure karena
# windows-latest kini mengarah ke image windows-2025-vs2026 (VS 2026, tanpa
# VS 2022), sehingga generator "Visual Studio 17 2022" tidak menemukan
# instance Visual Studio sama sekali. Runner dipin ke windows-2022 supaya
# generator VS 17 2022 selalu tersedia. Jangan kembalikan ke windows-latest
# tanpa mengganti generator ke "Visual Studio 18 2026" dan memvalidasi
# ulang JUCE 8.0.15 + CMake terhadap toolchain itu.
#
# PENTING — status CI:
# Run pertama (45009798107) gagal di Configure (penyebab di atas). Jangan klaim
# "CI Windows lolos" sebelum ada run yang benar-benar hijau di GitHub.
#
# Pinning: actions/checkout dipin ke commit SHA penuh (bukan tag bergerak),
# supaya build dapat direproduksi.

name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    # Dipin ke windows-2022: windows-latest kini = windows-2025-vs2026 (VS 2026,
    # tanpa VS 2022) sehingga generator "Visual Studio 17 2022" gagal (run 45009798107).
    runs-on: windows-2022
    steps:
      # actions/checkout v4 — commit 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Configure (Visual Studio 2022, x64, Release)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build (maks. 2 job paralel, mengikuti batas RAM VM)
        run: cmake --build build --config Release --parallel 2

      - name: Test (CTest)
        run: ctest --test-dir build -C Release --output-on-failure
